      - "next Worker objective with allowed_files, verify, and stop_if if not complete"
    receipt:
      result: done
      decision: "The first IPC contract slice is complete but the full outcome is not; continue with renderer service migration and folder restructuring."
      slice_complete: true
      full_outcome_complete: false
      missing_evidence:
        - "Renderer components still call window.appBridge directly; architecture doc recommends renderer service modules between UI and the bridge."
        - "Electron main IPC handlers are still in one large ipcHandlers.ts file rather than grouped by capability."
        - "Folder structure cleanup has not yet moved Electron/runtime files into a sane grouped layout."
      next_allowed_task: T005
      next_worker:
        objective: "Add renderer desktop service modules that wrap window.appBridge and migrate UI components/pages to those services."
        allowed_files:

        - cmd: "npm run build"
          status: pass
      summary: "Created shared AppBridge IPC contract, removed the old window.electronAPI preload surface and generic invoke escape hatch, exposed only window.appBridge, updated global renderer types, and migrated renderer call sites to grouped appBridge capability methods."
  - id: T004
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit the completed implementation slice and decide whether more safe local slices are required for the original cleanup."
    inputs:
      - "Latest Worker receipt"
      - "Current dirty diff"
      - "Verification results"

        - "src/types/electron.d.ts"
        - "electron/preload.ts"
        - "electron/tsconfig.json"
        - "src/App.tsx"
        - "src/_pages/main-activity/History.tsx"
        - "src/_pages/main-activity/Home.tsx"
        - "src/_pages/main-activity/MainActivityLayout.tsx"
        - "src/_pages/main-activity/Personalization.tsx"
        - "src/_pages/main-activity/Settings.tsx"
        - "src/_pages/toolbar/Queue.tsx"
        - "src/_pages/toolbar/Solutions.tsx"
        - "src/components/Queue/QueueCommands.tsx"
        - "src/components/ToolbarChatPanel.tsx"
        - "src/components/ui/ModelSelector.tsx"
      commands:
